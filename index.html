  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
    }
    #app { display: flex; width: 100vw; height: 100vh; height: 100dvh; }
    
    #sidebar {
      width: 410px; min-width: 350px; max-width: 440px; height: 100%; background: #ffffff;
      display: flex; flex-direction: column; z-index: 1000; box-shadow: 2px 0 12px rgba(0,0,0,0.18);
    }
    #sidebar-header {
      background: #0f172a; color: #ffffff; padding: 14px 18px; border-bottom: 1px solid #334155; flex-shrink: 0;
    }
    #sidebar-header h2 { margin: 0 0 3px 0; font-size: 16px; font-weight: 700; }
    #sidebar-header p { margin: 0 0 10px 0; font-size: 11.5px; color: #94a3b8; }

    /* Mulaqats Link Button */
    .mulaqat-header-btn {
      display: inline-flex; align-items: center; gap: 7px;
      background: #0284c7; color: #ffffff; text-decoration: none;
      font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25); transition: background 0.15s ease;
      cursor: pointer;
    }
    .mulaqat-header-btn:hover { background: #0369a1; color: #ffffff; }

    /* Top Floating Button on Map */
    #map-top-bar {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 1000; pointer-events: auto;
    }
    .mulaqat-map-btn {
      display: inline-flex; align-items: center; gap: 7px;
      background: #0f172a; color: #38bdf8; text-decoration: none;
      font-size: 12.5px; font-weight: 700; padding: 8px 18px; border-radius: 24px;
      border: 1.5px solid #0284c7; box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      transition: all 0.15s ease; cursor: pointer;
    }
    .mulaqat-map-btn:hover { background: #0284c7; color: #ffffff; }

    #legend-bar {
      background: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 7px 12px;
      display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #475569;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }

    #stops-list {
      flex: 1; overflow-y: scroll; list-style: none; margin: 0; padding: 8px 10px; -webkit-overflow-scrolling: touch;
    }
    .stop-card {
      display: flex; align-items: flex-start; padding: 10px; margin-bottom: 6px;
      border-radius: 8px; border: 1px solid #e2e8f0; background: #f8fafc; cursor: pointer; transition: all 0.15s ease-in-out;
    }
    .stop-card:hover, .stop-card:active { background: #e0f2fe; border-color: #38bdf8; }
    .stop-card.active { background: #dbeafe; border-color: #2563eb; }
    .stop-card.remote-card { border-left: 4px solid #f59e0b; }

    .badge {
      font-size: 10px; font-weight: 700; border-radius: 5px; padding: 3px 6px;
      min-width: 28px; text-align: center; margin-right: 9px; color: white; background: #475569; flex-shrink: 0;
    }
    .badge-start { background: #16a34a !important; }
    .badge-end { background: #dc2626 !important; }
    .badge-remote { background: #d97706 !important; }

    .stop-meta { flex: 1; min-width: 0; }
    .stop-title { font-size: 13px; font-weight: 700; color: #0f172a; margin-bottom: 2px; }
    .stop-masjid { font-size: 11.5px; font-weight: 600; color: #1e40af; margin-bottom: 2px; word-wrap: break-word; }
    .stop-addr { font-size: 11px; color: #475569; margin-bottom: 2px; line-height: 1.35; word-wrap: break-word; }
    .stop-pop { font-size: 10.5px; font-weight: 500; color: #64748b; }
    
    .remote-notice {
      font-size: 10.5px; font-weight: 700; color: #b45309; background: #fef3c7;
      border: 1px solid #fde68a; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 3px;
    }

    .local-alt-box {
      margin-top: 6px; padding: 6px 8px; background: #f0fdf4; border: 1px solid #bbf7d0;
      border-radius: 6px; font-size: 10.5px; line-height: 1.35; word-wrap: break-word;
    }
    .local-alt-title { font-weight: 700; color: #166534; margin-bottom: 2px; }
    .local-alt-addr { color: #374151; font-size: 10px; margin-top: 1px; }

    .directions-btn {
      display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; padding: 3px 8px;
      font-size: 10.5px; font-weight: 600; color: #1d4ed8; background: #eff6ff;
      border: 1px solid #bfdbfe; border-radius: 4px; text-decoration: none; transition: all 0.15s ease-in-out;
    }
    .directions-btn:hover { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }
    .directions-btn i { font-size: 10px; }

    .directions-btn-green {
      color: #15803d; background: #f0fdf4; border-color: #bbf7d0;
    }
    .directions-btn-green:hover { background: #dcfce7; color: #166534; border-color: #86efac; }

    #map { flex: 1; height: 100%; width: 100%; position: relative; z-index: 10; }

    #mobile-bar {
      display: none; position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      z-index: 2000; background: #0f172a; color: white; border: 1px solid #334155;
      padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35); cursor: pointer;
    }
    @media (max-width: 768px) {
      #mobile-bar { display: block; }
      #sidebar { width: 100%; max-width: 100%; min-width: 100%; position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
      body.show-map #sidebar { display: none !important; }
      #map-top-bar { top: 10px; }
      .mulaqat-map-btn { font-size: 11px; padding: 6px 12px; }
    }

    .leaflet-popup-content-wrapper {
      background: #ffffff !important; border-radius: 8px !important; padding: 0 !important;
      box-shadow: 0 6px 20px rgba(0,0,0,0.28) !important;
      min-width: 320px !important; max-width: 380px !important;
    }
    .leaflet-popup-content {
      margin: 10px 14px !important; line-height: 1.4 !important;
      white-space: normal !important; word-wrap: break-word !important;
    }
    .leaflet-popup-tip { background: #ffffff !important; }

    .masjid-marker-primary {
      background: #ffffff;
      border: 2.5px solid #1D4ED8;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(29, 78, 216, 0.35);
      transition: transform 0.15s ease-in-out;
    }
    .masjid-marker-primary:hover {
      transform: scale(1.15);
      border-color: #1e40af;
    }
    .masjid-marker-primary img {
      width: 21px;
      height: 21px;
      object-fit: contain;
    }

    .masjid-marker-alternate {
      background: #ffffff;
      border: 2px dashed #0D9488;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(13, 148, 136, 0.35);
      transition: transform 0.15s ease-in-out;
    }
    .masjid-marker-alternate:hover {
      transform: scale(1.2);
    }
    .masjid-marker-alternate img {
      width: 17px;
      height: 17px;
      object-fit: contain;
    }

    let isMapView = false;

    function getDirectionsUrl(addr) {
      return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(addr);
    }

    function toggleMobileView() {
      isMapView = !isMapView;
      const btn = document.getElementById("mobile-bar");
      if (isMapView) {
        document.body.classList.add("show-map");
        btn.innerText = "Switch to Cities List";
        setTimeout(() => { map.invalidateSize(); }, 100);
      } else {
        document.body.classList.remove("show-map");
        btn.innerText = "Switch to Map";
      }
    }

    const map = L.map('map', {
      center: [44.8, -91.5],
      zoom: 6,
      zoomControl: true,
      closePopupOnClick: false
    });

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    const coords = stopsData.map(s => [s.lat, s.lon]);
    L.polyline(coords, {
      color: '#1D4ED8',
      weight: 3.5,
      opacity: 0.85,
      dashArray: '6, 6'
    }).addTo(map);

    const markerRegistry = {};
    const alternatesLayer = L.layerGroup().addTo(map);

    function setupInteractivePopup(marker) {
      let closeTimeout = null;

      marker.on('mouseover', () => {
        if (closeTimeout) {
          clearTimeout(closeTimeout);
          closeTimeout = null;
        }
        marker.openPopup();

        const popup = marker.getPopup();
        if (popup && popup.getElement()) {
          const popupEl = popup.getElement();
          popupEl.onmouseenter = () => {
            if (closeTimeout) {
              clearTimeout(closeTimeout);
              closeTimeout = null;
            }
          };
          popupEl.onmouseleave = () => {
            closeTimeout = setTimeout(() => {
              marker.closePopup();
            }, 250);
          };
        }
      });

      marker.on('mouseout', () => {
        closeTimeout = setTimeout(() => {
          marker.closePopup();
        }, 250);
      });
    }

    alternatesData.forEach(alt => {
      const altIcon = L.divIcon({
        className: '',
        html: `<div class="masjid-marker-alternate" title="${alt.name}"><img src="${masjidIconBase64}" alt="Masjid" /></div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });

      const dirUrl = getDirectionsUrl(alt.addr);
      const altCardHtml = `

          <a class="directions-btn" href="${dirUrl}" target="_blank" rel="noopener noreferrer">
            <i class="fa fa-diamond-turn-right"></i> Directions in Google Maps
          </a>
        </div>
      `;

      const m = L.marker([alt.lat, alt.lon], { icon: altIcon }).addTo(alternatesLayer);
      m.bindPopup(altCardHtml, { offset: [0, -10], closeButton: false, autoPan: false });
      setupInteractivePopup(m);
    });

      const isRemote = s.is_remote;

      let badgeColor = isStart ? '#15803D' : (isEnd ? '#B91C1C' : (isRemote ? '#d97706' : '#1E40AF'));
      let badgeLabel = isStart ? `START: ${s.city}, ${s.state}` : (isEnd ? `END: ${s.city}, ${s.state}` : `#${s.id}. ${s.city}, ${s.state}`);

      const primaryDirUrl = getDirectionsUrl(s.addr);
      let remoteNote = '';
      let localAltHtml = '';

      if (isRemote) {
        remoteNote = `<div class="remote-notice">⚠️ Nearest facility in ${s.fac_city} (~${s.distance_miles} mi away)</div>`;
        if (s.alt_name) {
          const altDirUrl = getDirectionsUrl(s.alt_addr);
          localAltHtml = `
            <div class="local-alt-box">
              <div class="local-alt-title">🎓 Local Campus / Education Resource (${s.alt_dist}):</div>
              <div style="font-weight:700;color:#1e293b;">${s.alt_name}</div>
              <div class="local-alt-addr">${s.alt_addr}</div>
              <a class="directions-btn directions-btn-green" href="${altDirUrl}" target="_blank" rel="noopener noreferrer">
                <i class="fa fa-diamond-turn-right"></i> Navigate to Local Resource
              </a>
            </div>
          `;
        }
      }

      let cardHtml = `
        <div style="text-align: left; word-wrap: break-word;">
          <div style="background: ${badgeColor}; color: #fff; font-weight: 700; font-size: 11px; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 5px;">
            ${badgeLabel}
          </div>
          <div style="font-size: 13.5px; font-weight: 700; color: #0f172a; margin-bottom: 3px;">${s.masjid}</div>
          <div style="font-size: 11.5px; color: #475569; margin-bottom: 4px; line-height: 1.35;">${s.addr}</div>
          <div style="font-size: 11px; font-weight: 600; color: ${badgeColor}; margin-bottom: 4px;">Est. Muslim Pop: ${s.pop}</div>
          ${remoteNote}
          <div style="margin-top: 4px;">
            <a class="directions-btn" href="${primaryDirUrl}" target="_blank" rel="noopener noreferrer">
              <i class="fa fa-diamond-turn-right"></i> Navigate to ${isRemote ? 'Regional Center' : 'Masjid'}
            </a>
          </div>
          ${localAltHtml}
        </div>
      `;

      let marker;

      if (isStart) {
        const startIcon = L.divIcon({
          className: '',
          html: `<div style="background:#15803D; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-size:14px; box-shadow:0 3px 8px rgba(0,0,0,0.3); border:2px solid white;"><i class="fa fa-play" style="margin-left:2px;"></i></div>`,
          iconSize: [34, 34],
          iconAnchor: [17, 17]
        });
        marker = L.marker([s.lat, s.lon], { icon: startIcon }).addTo(map);
        marker.bindPopup(cardHtml, { offset: [0, -18], closeButton: false, autoPan: false });
      } else if (isEnd) {
        const endIcon = L.divIcon({
          className: '',
          html: `<div style="background:#B91C1C; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-size:14px; box-shadow:0 3px 8px rgba(0,0,0,0.3); border:2px solid white;"><i class="fa fa-flag-checkered"></i></div>`,
          iconSize: [34, 34],
          iconAnchor: [17, 17]
        });
        marker = L.marker([s.lat, s.lon], { icon: endIcon }).addTo(map);
        marker.bindPopup(cardHtml, { offset: [0, -18], closeButton: false, autoPan: false });
      } else if (isRemote) {
        const remoteIcon = L.divIcon({
          className: '',
          html: `<div style="background:#d97706; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-size:13px; box-shadow:0 3px 8px rgba(217,119,6,0.5); border:2px solid white;"><i class="fa fa-triangle-exclamation"></i></div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });
        marker = L.marker([s.lat, s.lon], { icon: remoteIcon }).addTo(map);
        marker.bindPopup(cardHtml, { offset: [0, -14], closeButton: false, autoPan: false });
      } else {
        const primaryIcon = L.divIcon({
          className: '',
          html: `<div class="masjid-marker-primary"><img src="${masjidIconBase64}" alt="Masjid" /></div>`,
          iconSize: [34, 34],
          iconAnchor: [17, 17]
        });
        marker = L.marker([s.lat, s.lon], { icon: primaryIcon }).addTo(map);
        marker.bindPopup(cardHtml, { offset: [0, -18], closeButton: false, autoPan: false });
      }

      setupInteractivePopup(marker);
      markerRegistry[s.id] = marker;
    });

    if (alternatesData.length > 0) {
      const overlayMaps = {
        "En-Route Alternate Facilities": alternatesLayer
      };
      L.control.layers(null, overlayMaps, { position: 'topright', collapsed: false }).addTo(map);
    }

    // Build sidebar cards
    const list = document.getElementById("stops-list");
    stopsData.forEach(s => {
      const li = document.createElement("li");
      const isRemote = s.is_remote;
      li.className = `stop-card ${isRemote ? 'remote-card' : ''}`;

      let badgeClass = s.id === 1 ? "badge-start" : (s.id === stopsData.length ? "badge-end" : (isRemote ? "badge-remote" : ""));
      let badgeLabel = s.id === 1 ? "START" : (s.id === stopsData.length ? "END" : "#" + s.id);

      const primaryDirUrl = getDirectionsUrl(s.addr);

      let remoteNoticeHtml = isRemote 
        ? `<div class="remote-notice">⚠️ Nearest facility in ${s.fac_city} (~${s.distance_miles} mi away)</div>` 
        : '';

      let localAltSidebarHtml = '';
      if (isRemote && s.alt_name) {
        const altDirUrl = getDirectionsUrl(s.alt_addr);
        localAltSidebarHtml = `
          <div class="local-alt-box">
            <div class="local-alt-title">🎓 Campus / Education Alternative (${s.alt_dist}):</div>
            <div style="font-weight:700;color:#1e293b;">${s.alt_name}</div>
            <div class="local-alt-addr">${s.alt_addr}</div>
            <a class="directions-btn directions-btn-green" href="${altDirUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();">
              <i class="fa fa-diamond-turn-right"></i> Navigate to Local Resource
            </a>
          </div>
        `;
      }

      li.innerHTML = `
        <div class="badge ${badgeClass}">${badgeLabel}</div>
        <div class="stop-meta">
          <div class="stop-title">${s.city}, ${s.state}</div>
          <div class="stop-masjid">${s.masjid}</div>
          <div class="stop-addr">${s.addr}</div>
          <div class="stop-pop">Est. Muslim Pop: ${s.pop}</div>
          ${remoteNoticeHtml}
          <div>
            <a class="directions-btn" href="${primaryDirUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();">
              <i class="fa fa-diamond-turn-right"></i> Directions
            </a>
          </div>
          ${localAltSidebarHtml}
        </div>
      `;

      li.addEventListener("click", () => {
        document.querySelectorAll(".stop-card").forEach(el => el.classList.remove("active"));
        li.classList.add("active");

        if (window.innerWidth <= 768) {
          document.body.classList.add("show-map");
          isMapView = true;
          document.getElementById("mobile-bar").innerText = "Switch to Cities List";
        }

        map.invalidateSize();
        map.flyTo([s.lat, s.lon], 13, { animate: true, duration: 1.0 });

        const m = markerRegistry[s.id];
        if (m) {
          setTimeout(() => { m.openPopup(); }, 450);
        }
      });

      list.appendChild(li);
    });
  </script>
</body>
</html>
